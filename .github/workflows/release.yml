name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run python scripts/release.py verify --tag "$GITHUB_REF_NAME"
      - run: uv run pytest
      - run: uv build
      - run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - run: uv run python scripts/release.py notes > release-notes.md
      - name: Publish build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Cortex $GITHUB_REF_NAME" --notes-file release-notes.md
